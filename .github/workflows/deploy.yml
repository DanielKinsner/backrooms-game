name: Build (and deploy when Pages is available)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # the lockfile must be validated by the same npm that wrote it —
      # npm 10/11 disagree about platform-optional dep metadata (libc et al.)
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # The repo went private (free plan ⇒ Pages disabled), so deploys only run
  # when triggered by hand — and even then a Pages failure won't go red.
  # If the repo ever goes public (or Pro) again, run this workflow manually
  # or drop the `if:` to restore deploy-on-push.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
